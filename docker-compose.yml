# version: '3.8'

services:
    lmw-web:
        build:
            context: ./
            dockerfile: Dockerfile
        image: lmw-web-image
        container_name: lmw-web-app
        restart: always
        working_dir: /var/www/

        volumes:
            - ./src:/var/www
            - ./config/.env:/var/www/.env
            - ./src/storage:/var/www/storage
            - /etc/ssl/wapresri/b.wapresri.go.id.key:/etc/nginx/ssl/server.key:ro
            - /etc/ssl/wapresri/combined_server_chain.crt:/etc/nginx/ssl/combined_server_chain.crt:ro
        ports:
            - "80:8080"
            - "443:8443"
            - "8001:8001"
        networks:
            - lmw-network
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
            minio:
                condition: service_started

        environment:
            APP_ENV: local
            APP_DEBUG: ${APP_DEBUG:-true}

    lmw-api:
        build:
            context: ./
            dockerfile: Dockerfile
        image: lmw-api-image
        container_name: lmw-api-app
        restart: always
        working_dir: /var/www/

        volumes:
            - ./src:/var/www
            - ./config/.env:/var/www/.env
            - /etc/ssl/wapresri/b.wapresri.go.id.key:/etc/nginx/ssl/server.key:ro
            - /etc/ssl/wapresri/combined_server_chain.crt:/etc/nginx/ssl/combined_server_chain.crt:ro
        ports:
            - "8080:8080"
        networks:
            - lmw-network
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
            minio:
                condition: service_started
        environment:
            APP_ENV: local
            APP_DEBUG: ${APP_DEBUG:-true}
            IS_API_SERVER: 'true'

        healthcheck:
            test: ["CMD", "curl", "--silent", "--fail", "http://127.0.0.1:8080/fpm-ping"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

    lmw-scheduler:
        build:
            context: ./
            dockerfile: Dockerfile

        image: lmw-scheduler-image
        container_name: lmw-scheduler
        restart: always
        working_dir: /var/www/

        volumes:
            - ./src:/var/www
            - ./config/.env:/var/www/.env
            - ./config/supervisord-scheduler.conf:/etc/supervisor/conf.d/supervisord.conf

        command: /usr/bin/supervisord -c /etc/supervisor/conf.d/supervisord.conf

        healthcheck:
            test: ["CMD-SHELL", "test $$(supervisorctl -c /etc/supervisor/conf.d/supervisord.conf status laravel-jobs laravel-schedule 2>/dev/null | grep -c RUNNING) -eq 2"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

        networks:
            - lmw-network
        depends_on:
            - mysql
            - redis

    mysql:
        image: 'mysql/mysql-server:8.0'
        container_name: lmw-db
        restart: always
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS}'
        volumes:
            - 'lmw-mysql-data:/var/lib/mysql'
        networks:
            - lmw-network
        healthcheck:
            test: [ "CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}" ]
            retries: 3
            timeout: 5s

    redis:
        image: 'redis:alpine'
        container_name: lmw-redis
        restart: always
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'lmw-redis-data:/data'
        networks:
            - lmw-network
        healthcheck:
            test: [ "CMD", "redis-cli", "ping" ]
            retries: 3
            timeout: 5s

    mailpit:
        image: 'axllent/mailpit:latest'
        container_name: lmw-mailpit
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - lmw-network

    minio:
        image: 'minio/minio:latest'
        container_name: lmw-minio
        ports:
            - '0.0.0.0:${FORWARD_MINIO_PORT:-9000}:9000'
            - '0.0.0.0:${FORWARD_MINIO_CONSOLE_PORT:-8900}:8900'
        environment:
            MINIO_ROOT_USER: lmw_v2
            MINIO_ROOT_PASSWORD: C3Nd00Ld!L4UT
        volumes:
            - 'lmw-minio-data:/data'
        networks:
            - lmw-network
        command: 'minio server /data --console-address ":8900"'
        healthcheck:
            test: [ "CMD", "mc", "ready", "local" ]
            retries: 3
            timeout: 5s

    reverb:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: lmw-reverb
        restart: always
        volumes:
            - ./src:/var/www
            - ./config/.env:/var/www/.env
        command: php artisan reverb:start --host=0.0.0.0 --port=8081
        healthcheck:
            test: ["CMD", "php", "-r", "$$s=@fsockopen('127.0.0.1',8081,$$e,$$m,5); if (!$$s) exit(1); fclose($$s);"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s
        env_file: ./config/.env
        ports:
            - "8081:8081"
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - lmw-network

    evolution-api:
        image: evoapicloud/evolution-api:latest
        container_name: lmw-wa-engine
        restart: always
        ports:
            - "8082:8080"
        volumes:
            - evolution_instances:/evolution/instances
        environment:
            - SERVER_URL=http://localhost:8082
            - DEL_INSTANCE=false
            
            # VARIABEL INI WAJIB ADA MESKIPUN DB DIMATIKAN
            - DATABASE_PROVIDER=mysql
            - DATABASE_CONNECTION_URI=mysql://root:${DB_PASSWORD}@mysql:3306/evolution
            
            # STATUS DB DIMATIKAN
            - DATABASE_ENABLED=false
            - DATABASE_SAVE_DATA_INSTANCE=false
            - DATABASE_SAVE_DATA_NEW_MESSAGE=false
            - DATABASE_SAVE_MESSAGE_UPDATE=false
            - DATABASE_SAVE_DATA_CONTACTS=false
            - DATABASE_SAVE_DATA_CHATS=false
            - DATABASE_SAVE_DATA_LABELS=false
            - DATABASE_SAVE_DATA_HISTORIC=false
            
            - RABBITMQ_ENABLED=false
            
            # REDIS TETAP MENYALA
            - CACHE_REDIS_ENABLED=true
            - CACHE_REDIS_URI=redis://lmw-redis:6379/1
            - CACHE_REDIS_PREFIX_KEY=evolution_v2
            - CACHE_REDIS_SAVE_INSTANCES=true
            - CACHE_LOCAL_ENABLED=false
            
            - S3_ENABLED=false
            - AUTHENTICATION_API_KEY=yAak6w5pzF3XzcHUTEbc
        healthcheck:
            test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s
        networks:
            - lmw-network
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy

networks:
    lmw-network:
        driver: bridge

volumes:
    lmw-mysql-data:
        driver: local
    lmw-redis-data:
        driver: local
    lmw-minio-data:
        driver: local
    evolution_instances:
        driver: local
